[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "profullstack-x402-gateway"
version = "0.1.0"
description = "Sell crawl access to AI training crawlers by the day over x402, settled by CoinPay. ASGI and WSGI middleware, signed passes, robots.txt. A port of @profullstack/x402-gateway."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [{ name = "Profullstack, LLC" }]
keywords = ["x402", "402", "crawler", "ai-crawler", "gptbot", "claudebot", "robots.txt", "coinpay", "usdc", "asgi", "wsgi", "middleware", "paywall"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Internet :: WWW/HTTP :: WSGI :: Middleware",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/profullstack/x402-ports"
Source = "https://github.com/profullstack/x402-ports/tree/main/python/x402_gateway"

[tool.hatch.build.targets.wheel]
packages = ["src/x402_gateway"]
