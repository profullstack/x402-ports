[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "coinpay"
version = "0.1.0"
description = "The CoinPay CLI (coinpay x402 pay, checkout, wallets) from pip. A thin launcher for @profullstack/coinpay."
readme = "README.md"
license = "MIT"
requires-python = ">=3.8"
authors = [{ name = "Profullstack, LLC" }]
keywords = ["coinpay", "x402", "crypto", "payments", "usdc", "cli"]
dependencies = []

[project.scripts]
coinpay = "coinpay:main"

[project.urls]
Homepage = "https://github.com/profullstack/x402-ports"
Upstream = "https://www.npmjs.com/package/@profullstack/coinpay"

[tool.hatch.build.targets.wheel]
packages = ["src/coinpay"]
