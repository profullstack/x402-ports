[package]
name = "x402-gateway"
version = "0.1.0"
description = "Sell crawl access to AI training crawlers by the day over x402, settled by CoinPay. http-types middleware (axum feature), signed passes, robots.txt. A port of @profullstack/x402-gateway."
readme = "README.md"
keywords = ["x402", "crawler", "paywall", "coinpay", "axum"]
categories = ["web-programming::http-server", "authentication"]
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
http = "1"
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
num-bigint = "0.4"
num-traits = "0.2"
ureq = { version = "2", optional = true, default-features = false, features = ["tls", "json"] }
axum = { version = "0.8", optional = true, default-features = false }
tokio = { version = "1", optional = true, features = ["rt"] }

[features]
default = ["ureq"]
ureq = ["dep:ureq"]
axum = ["dep:axum", "dep:tokio"]

[dev-dependencies]
serde_json = "1"
base64 = "0.22"
num-bigint = "0.4"
