name: split-php
# Packagist cannot install a package whose composer.json sits in a subdirectory, so each
# PHP package is mirrored into a read-only repository of its own:
#   php/x402-gateway -> profullstack/x402-gateway-php
#   php/coinpay      -> profullstack/coinpay-php
# Those mirrors are overwritten on every push to main and on every php-v* tag.
#
# Switched on by the PHP_SPLIT_ENABLED repository variable. It also needs PHP_SPLIT_TOKEN,
# a fine-grained PAT with contents:write on the two mirrors. Without that secret the job
# leaves a notice and skips, so enabling the variable early never turns CI red.
on:
  push:
    branches: [main]
    tags: ["php-v*"]
  workflow_dispatch:
jobs:
  split:
    if: ${{ vars.PHP_SPLIT_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { dir: php/x402-gateway, repo: x402-gateway-php }
          - { dir: php/coinpay, repo: coinpay-php }
    steps:
      - id: gate
        env:
          TOKEN: ${{ secrets.PHP_SPLIT_TOKEN }}
          MIRROR: ${{ matrix.repo }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::PHP_SPLIT_TOKEN is not set, so $MIRROR was left untouched."
          fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.ready == 'true'
        with: { fetch-depth: 0 }
      - uses: symplify/monorepo-split-github-action@v2.3.0
        if: steps.gate.outputs.ready == 'true'
        with:
          package_directory: ${{ matrix.dir }}
          repository_organization: profullstack
          repository_name: ${{ matrix.repo }}
          branch: main
          user_name: github-actions
          user_email: actions@github.com
          tag: ${{ startsWith(github.ref, 'refs/tags/php-v') && github.ref_name || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.PHP_SPLIT_TOKEN }}
