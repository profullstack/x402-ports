name: split-php
# Packagist needs composer.json at a repository root. This mirrors each PHP package
# into a read-only repo (profullstack/x402-gateway-php, profullstack/coinpay-php)
# whenever main or a php-v* tag moves. Needs PHP_SPLIT_TOKEN (a PAT with repo scope).
on:
  push:
    branches: [main]
    tags: ["php-v*"]
jobs:
  split:
    if: ${{ vars.PHP_SPLIT_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { dir: php/x402-gateway, repo: x402-gateway-php }
          - { dir: php/coinpay, repo: coinpay-php }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: symplify/monorepo-split-github-action@v2.3.0
        with:
          package_directory: ${{ matrix.dir }}
          repository_organization: profullstack
          repository_name: ${{ matrix.repo }}
          user_name: github-actions
          user_email: actions@github.com
          tag: ${{ startsWith(github.ref, 'refs/tags/php-v') && github.ref_name || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.PHP_SPLIT_TOKEN }}
