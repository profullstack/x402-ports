name: release-python
on:
  push: { tags: ["python-v*"] }
jobs:
  publish:
    runs-on: ubuntu-latest
    # Publishes with an API token held as a secret on the `pypi` environment,
    # which only tags matching python-v* may deploy to. That keeps the gate —
    # a branch push can never reach the token — without depending on PyPI's
    # trusted-publisher form, whose claims have to be retyped by hand for every
    # project and silently reject the release when one field is off.
    environment: pypi
    permissions: { contents: read }
    strategy: { matrix: { package: [x402_gateway, coinpay] } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install build && cd python/${{ matrix.package }} && python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: "python/${{ matrix.package }}/dist"
          password: ${{ secrets.PYPI_API_TOKEN }}
          # A re-run, or a tag that only moves one of the two packages, should
          # not fail on the version that is already up.
          skip-existing: true
