name: release-python
on:
  push: { tags: ["python-v*"] }
jobs:
  publish:
    runs-on: ubuntu-latest
    # PyPI trusted publishing: register this repo + workflow on pypi.org for both projects.
    permissions: { id-token: write, contents: read }
    strategy: { matrix: { package: [x402_gateway, coinpay] } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install build && cd python/${{ matrix.package }} && python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
        with: { packages-dir: python/${{ matrix.package }}/dist }
