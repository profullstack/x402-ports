name: release-elixir
on:
  push: { tags: ["elixir-v*"] }
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with: { otp-version: "27", elixir-version: "1.18" }
      - run: cd elixir/x402_gateway && mix deps.get && mix hex.publish --yes
        env: { HEX_API_KEY: "${{ secrets.HEX_API_KEY }}" }
